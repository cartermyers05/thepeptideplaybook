<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Rainbow gradient for hexagon stroke -->
    <linearGradient id="rainbow-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(45, 80%, 50%)" />
      <stop offset="20%" stop-color="hsl(25, 90%, 55%)" />
      <stop offset="40%" stop-color="hsl(350, 80%, 55%)" />
      <stop offset="60%" stop-color="hsl(270, 70%, 55%)" />
      <stop offset="80%" stop-color="hsl(210, 80%, 55%)" />
      <stop offset="100%" stop-color="hsl(160, 70%, 45%)" />
    </linearGradient>
    
    <!-- Radial gradient for fill -->
    <radialGradient id="rainbow-fill" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(45, 80%, 50%)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="hsl(270, 70%, 55%)" stop-opacity="0.05" />
    </radialGradient>
  </defs>

  <!-- Hexagonal molecule structure -->
  <path
    d="M16 2L28 9V23L16 30L4 23V9L16 2Z"
    stroke="url(#rainbow-stroke)"
    stroke-width="2"
    fill="url(#rainbow-fill)"
  />
  <!-- Center node -->
  <circle cx="16" cy="16" r="3" fill="url(#rainbow-stroke)" />
  <!-- Connection lines -->
  <path
    d="M16 16L16 7M16 16L23 20M16 16L9 20"
    stroke="url(#rainbow-stroke)"
    stroke-width="2"
    stroke-linecap="round"
  />
  <!-- Outer nodes - different colors -->
  <circle cx="16" cy="7" r="2" fill="hsl(45, 80%, 50%)" />
  <circle cx="23" cy="20" r="2" fill="hsl(270, 70%, 55%)" />
  <circle cx="9" cy="20" r="2" fill="hsl(160, 70%, 45%)" />
</svg>
